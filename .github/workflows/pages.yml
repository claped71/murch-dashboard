name: Deploy to GitHub Pages

# The legacy Pages builder stopped publishing on 2026-08-06: every build after
# 11:28 sat in "building" or errored, so the live site silently served an old
# commit while the repo moved on. This deploys the repo as a static artifact
# through Actions instead, which reports success or failure explicitly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
